<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f4f4f9;
      }
      form {
        max-width: 600px;
        margin: 0 auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      fieldset {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 15px;
        margin-bottom: 20px;
      }
      legend {
        font-weight: bold;
        padding: 0 10px;
        color: #333;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .radio-group label,
      .checkbox-group label {
        display: inline;
        font-weight: normal;
        margin-right: 10px;
      }
      input[type="text"],
      input[type="email"],
      input[type="url"],
      input[type="date"],
      input[type="search"],
      input[type="password"],
      select,
      textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      textarea {
        resize: vertical;
      }
      button[type="submit"] {
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
      }
      button[type="submit"]:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <h2 style="text-align: center">Job Application Form</h2>

    <form action="#" method="POST">
      <fieldset>
        <legend>Personal Information</legend>

        <div class="form-group">
          <label Aksar for="full-name">Full Name:</label>
          <input
            type="text"
            id="full-name"
            name="full_name"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="xyz@email.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number:</label>
          <input
            type="text"
            id="phone"
            name="phone"
            placeholder="e.g., +923000000000"
            required
          />
        </div>

        <div class="form-group">
          <label for="website">Website or Portfolio:</label>
          <input
            type="url"
            id="website"
            name="website"
            placeholder="https://yourportfolio.com"
          />
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth:</label>
          <input type="date" id="dob" name="dob" required />
        </div>
      </fieldset>

      <fieldset>
        <legend>Job Details</legend>

        <div class="form-group">
          <label for="job-position">Job Position:</label>
          <select id="job-position" name="job_position" required>
            <option value="" disabled selected>-- Select a Position --</option>
            <option value="frontend">Frontend Developer</option>
            <option value="backend">Backend Developer</option>
            <option value="ui-ux">UI/UX Designer</option>
            <option value="qa">QA Engineer</option>
          </select>
        </div>

        <div class="form-group radio-group">
          <label>Preferred Work Location:</label><br />
          <input
            type="radio"
            id="onsite"
            name="location"
            value="onsite"
            required
          />
          <label for="onsite">On-site</label>

          <input type="radio" id="remote" name="location" value="remote" />
          <label for="remote">Remote</label>

          <input type="radio" id="hybrid" name="location" value="hybrid" />
          <label for="hybrid">Hybrid</label>
        </div>

        <div class="form-group checkbox-group">
          <label>Skills:</label><br />
          <input type="checkbox" id="html" name="skills" value="html" />
          <label for="html">HTML</label>

          <input type="checkbox" id="css" name="skills" value="css" />
          <label for="css">CSS</label>

          <input
            type="checkbox"
            id="javascript"
            name="skills"
            value="javascript"
          />
          <label for="javascript">JavaScript</label>

          <input type="checkbox" id="react" name="skills" value="react" />
          <label for="react">React</label>

          <input type="checkbox" id="nodejs" name="skills" value="nodejs" />
          <label for="nodejs">Node.js</label>
        </div>

        <div class="form-group">
          <label for="resume">Resume Upload:</label>
          <input type="file" id="resume" name="resume" required />
        </div>

        <div class="form-group">
          <label for="about">Write About Yourself:</label>
          <textarea
            id="about"
            name="about"
            rows="4"
            placeholder="Tell us about your experience and background..."
          ></textarea>
        </div>
      </fieldset>

      <fieldset>
        <legend>Extra Section</legend>

        <div class="form-group">
          <label for="tech-stack">Search your favorite tech stack:</label>
          <input
            type="search"
            id="tech-stack"
            name="tech_stack"
            placeholder="e.g., MERN, Python..."
          />
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Confirm Password:</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder=" password"
            required
          />
        </div>
      </fieldset>
      <button type="submit">Submit Application</button>
    </form>
  </body>
</html>
